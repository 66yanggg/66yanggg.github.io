<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的小游戏合集</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background-color:#111827;
            color:#fff;
            font-family:system-ui,sans-serif;
            text-align:center;
            padding-top:120px;
        }
        h1{
            font-size:36px;
            margin-bottom:40px;
        }
        .game-btn{
            display:inline-block;
            padding:18px 40px;
            font-size:24px;
            background:#3b82f6;
            color:white;
            text-decoration:none;
            border-radius:12px;
            transition:0.2s;
        }
        .game-btn:hover{
            background:#2563eb;
        }
    </style>
</head>
<body>
    <h1>🎮 我的Unity小游戏</h1>
    <a class="game-btn" href="https://66yanggg.github.io/Unity-Game-Demo/">牧场动物大作战</a>
</body>
</html>
